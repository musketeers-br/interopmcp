[[iris]]
name = "local"
server = { host = "localhost", port = 1972, username = "@{env:WG_USER}", password = "@{env:WG_PASS}" }
pool = { min = 1, max = 1 }
idle_timeout_secs = 60
max_age_secs = 240
# The bridge's periodic tool refresh re-discovers the endpoint without a
# credential of its own. This endpoint requires one on every request, so the
# refresh was answered 401 and the bridge dropped its tool registration: for
# as long as the refresh interval, the tools were unreachable. The refresh is
# therefore switched off. The catalogue is discovered when a caller connects,
# with that caller's credential, and a catalogue rebuild becomes visible
# through the documented procedure - a restart of the MCP server.
tool_refresh_interval_secs = 0
endpoints = [
    { path = "/mcp/interopmcp", username = "@{env:WG_USER}", password = "@{env:WG_PASS}" }
]

[mcp]
transport = "http"
port = 8080
host = "0.0.0.0"

# Forward the caller's Authorization header; never substitute a shared
# endpoint identity. IRIS makes the authentication and entitlement decision.
allow_anonymous = false
